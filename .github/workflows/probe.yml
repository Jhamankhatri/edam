name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Probe
        run: |
          set +e
          emit() { printf '::notice title=PROBE_%s::%s\n' "$1" "$(printf '%s' "$2" | head -c 300)"; }
          emit JAVA "$(java -version 2>&1 | tr '\n' ' ')"
          emit JAVAC "$(javac -version 2>&1)"
          emit MVN "$(mvn -v 2>&1 | head -3 | tr '\n' ' ')"
          emit PSQL "$(psql --version 2>&1)"
          emit PGBIN "$(ls /usr/lib/postgresql/ 2>&1 | tr '\n' ' ')"
          emit DOCKER "$(docker --version 2>&1)"
          emit CPUS "$(nproc)"
          emit MEM "$(free -m | head -2 | tr '\n' ' ')"
