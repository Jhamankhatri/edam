name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        id: build
        shell: bash
        run: |
          set +e
          # Strip non-printable bytes from the console stream BEFORE it reaches GitHub's log
          # parser. Maven/surefire echoes binary XLSX response bodies from assertion failures,
          # and GitHub surfaces every [ERROR] line containing those bytes as a separate
          # annotation. That garbage pushed the actual PSQLException/Caused-by annotations
          # off the visible list. We keep the original (binary) build.log for diagnostics
          # artifact upload, but feed a sanitized copy to the console and to ci-report.py.
          mvn -B -ntp -Dstyle.color=never -e -DtrimStackTrace=false verify > build.log 2>&1
          mvn_rc=$?
          LC_ALL=C tr -dc '\t\n\r\40-\176' < build.log > build.clean.log
          cat build.clean.log
          echo "rc=$mvn_rc" >> "$GITHUB_OUTPUT"
          python3 tools/ci-report.py build.clean.log
          exit $mvn_rc

      - name: Diagnose failure
        if: steps.build.outputs.rc != 0
        shell: bash
        run: |
          set +e
          rc=${{ steps.build.outputs.rc }}
          # Print everything we need to stdout FIRST so it appears in the step's visible log,
          # then also to $GITHUB_STEP_SUMMARY. The sandbox environment cannot download the
          # job logs (results-receiver is unreachable), and artifact upload is quota-blocked,
          # so stdout is the only reliable channel.
          {
            echo "# Build failure diagnostics"
            echo ""
            echo "## Maven exit code: $rc"
            echo ""
            echo "### All [ERROR] lines (first 300)"
            echo '```'
            grep -nE "\[ERROR\]" build.clean.log | head -300
            echo '```'
            echo ""
            echo "### PSQLException / SQL error lines"
            echo '```'
            grep -nE "PSQLException|BadSqlGrammar|SQLState|ServerErrorMessage|ERROR:|does not exist|column .* (not exist|ambig|cannot)|operator does not exist|relation .* does not|syntax error|register count|register page" build.clean.log | head -100
            echo '```'
            echo ""
            echo "### Caused-by chain"
            echo '```'
            grep -nE "Caused by:" build.clean.log | head -60
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo ""
          echo "### SUREFIRE REPORTS (failing tests, stack traces only) >>>"
          shopt -s nullglob
          any=0
          for f in target/surefire-reports/TEST-*.txt; do
            if grep -qE '<<< (FAILURE|ERROR)!|Failures: [1-9]|Errors: [1-9]' "$f"; then
              any=1
              echo
              echo "=== $f ==="
              # Extract only stack-trace / header sections; drop any body line longer than 500
              # printable chars (those are binary response-body comparisons like XLSX payloads).
              LC_ALL=C awk '
                /^[A-Z][a-zA-Z ]+ Tests run:/ { print; in_f=1; next }
                /^$/ { if (in_f) print; next }
                {
                  # Strip any non-ASCII / control bytes so annotations never show binary noise.
                  line = $0
                  gsub(/[^[:print:]\t]/, ".", line)
                  if (length(line) > 500) next          # binary-payload assertion -> skip
                  print line
                }
              ' "$f" | head -n 200
              echo "---"
            fi
          done
          [ "$any" -eq 0 ] && echo "(no surefire failure reports found)"
          echo "<<< END SUREFIRE REPORTS"

          # Emit a single error annotation carrying the deepest Caused-by line from BOTH
          # the Maven log AND surefire reports. Maven's own MojoFailure wrapper is filtered.
          deep=$( {
            grep -E "Caused by:" build.log 2>/dev/null || true
            for f in target/surefire-reports/*.txt; do
              [ -f "$f" ] && grep -E "Caused by:" "$f" 2>/dev/null || true
            done
          } | grep -vE "MojoFailureException|SurefireBooterForkException|threshold exceeded|IllegalStateException: Failed to load ApplicationContext" | head -2 | tail -1 | head -c 1000)
          if [ -n "$deep" ]; then
            printf '::error title=ROOT_CAUSE::%s\n' "$deep"
          else
            comp=$(grep -nE "COMPILATION ERROR|cannot find symbol|incompatible types|already defined|does not exist" build.log | head -1 | head -c 1000)
            if [ -n "$comp" ]; then
              printf '::error title=COMPILE_ERROR::%s\n' "$comp"
            fi
          fi
          echo "----- DIAGNOSTIC EXCERPT -----"
          grep -nE "\[ERROR\]|Caused by:|APPLICATION FAILED|COMPILATION ERROR|cannot find symbol|Tests run:" build.log | head -80
          echo "----- ALL SUREFAILURE FAILURE REPORTS (first 200 lines each) -----"
          shopt -s nullglob
          fail_count=0
          for f in target/surefire-reports/TEST-*.txt; do
            # surefire puts failures/errors after "<<< FAILURE!" / "<<< ERROR!" markers; also include any
            # file that has at least one failing test line.
            if grep -qE '<<< (FAILURE|ERROR)!|Failures: [1-9]|Errors: [1-9]' "$f"; then
              fail_count=$((fail_count+1))
              echo
              echo "=========================================="
              echo "=== $f ==="
              echo "=========================================="
              head -n 200 "$f"
            fi
          done
          if [ "$fail_count" -eq 0 ]; then
            echo "(no surefire failure reports found in target/surefire-reports)"
            ls -la target/surefire-reports/ 2>/dev/null | head -20 || true
          fi

      - name: Fail the job
        if: steps.build.outputs.rc != 0
        run: exit ${{ steps.build.outputs.rc }}

      - name: Upload diagnostic logs and reports (failure only)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            build.log
            target/surefire-reports/TEST-*.txt
            target/surefire-reports/TEST-*.xml
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 9

      - name: Upload WAR
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: edam-war
          path: target/edam.war
          retention-days: 7
          if-no-files-found: warn
          overwrite: true

  # Renders the JSP views from the packaged executable WAR, which is the artifact that is
  # actually deployed. Spring Boot cannot render JSPs inside an embedded test container, so
  # this is the only faithful end-to-end view check.
  war-smoke:
    name: war-package-smoke-test
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edam
          POSTGRES_USER: edam
          POSTGRES_PASSWORD: edam-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edam -d edam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download WAR (fall back to local package if artifact storage is exhausted)
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: edam-war
          path: target
      - name: Package WAR locally if download failed
        if: steps.dl.outcome != 'success'
        run: mvn -B -ntp -DskipTests package
      - name: Start the executable WAR
        run: |
          set -euo pipefail
          ls -la target/edam.war
          export EDAM_DB_URL=jdbc:postgresql://localhost:5432/edam
          export EDAM_DB_USERNAME=edam
          export EDAM_DB_PASSWORD=edam-ci-only
          nohup java -jar target/edam.war --spring.profiles.active=local --server.port=18080 --logging.level.org.springframework.security.web=TRACE --logging.level.org.springframework.web.servlet=DEBUG > war.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Started EdamApplication" war.log; then echo "STARTED after ${i}s"; break; fi
            if grep -qE "APPLICATION FAILED TO START|BeanCreationException" war.log; then echo "STARTUP FAILED"; fi
            sleep 2
          done
          grep -q "Started EdamApplication" war.log || { echo "::error title=NO_START::application did not start"; tail -c 4000 war.log; exit 1; }
      - name: Verify JSP pages, security and health
        run: |
          set -uo pipefail
          fail=0
          scratch=$(mktemp -d)
          check() {
            printf '%s' "$3" | tr -d '\000' > "$scratch/actual.txt"
            if grep -qE -- "$4" "$scratch/actual.txt"; then
              printf '::notice title=OK %s::%s\n' "$1" "$2"
            else
              printf '::error title=FAIL %s::%s (expected to match: %s)\n' "$1" "$2" "$4"
              printf '::error title=FAIL %s body::%s\n' "$1" "$(tr -d '\r' < "$scratch/actual.txt" | head -c 700)"
              fail=1
            fi
          }
          lacks() {
            printf '%s' "$3" | tr -d '\000' > "$scratch/actual.txt"
            if grep -qE -- "$4" "$scratch/actual.txt"; then
              printf '::error title=FAIL %s::%s\n' "$1" "$2"; fail=1
            else
              printf '::notice title=OK %s::%s\n' "$1" "$2"
            fi
          }
          jar tf target/edam.war > war-contents.txt
          check WAR_LIB "libraries in WEB-INF/lib" "$(grep -c 'WEB-INF/lib/[^p]' war-contents.txt)" '^[1-9]'
          check WAR_LIBPROVIDED "embedded container in WEB-INF/lib-provided" "$(grep -c 'WEB-INF/lib-provided/' war-contents.txt)" '^[1-9]'
          check WAR_LAUNCHER "executable WAR launcher present" "$(grep -c 'loader/launch/WarLauncher' war-contents.txt)" '^[1-9]'
          check WAR_NO_JSP "no JSPs packaged (backend-only delivery)" "$(grep -c 'WEB-INF/jsp/' war-contents.txt)" '^0$'
          check WAR_NO_JASPER "no Jasper (no server-side rendering)" "$(grep -c -i 'jasper' war-contents.txt)" '^0$'
          check WAR_MIGRATIONS "Flyway migrations packaged" "$(grep -c 'db/migration/V' war-contents.txt)" '^[1-9]'
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://localhost:18080/actuator/health)
          check HEALTH_CODE "health endpoint status" "$health_code" '^200$'
          check HEALTH_BODY "health body reports UP" "$(cat /tmp/health.json)" '"status"[[:space:]]*:[[:space:]]*"UP"'
          lacks HEALTH_NODETAIL "health exposes no component detail" "$(cat /tmp/health.json)" '"(db|diskSpace|ping|database|dataSource)"|postgres|jdbc'
          api=$(curl -sS -w ' %{http_code}' -H 'Accept: application/json' http://localhost:18080/api/v1/system/info)
          check API_401 "api rejects anonymous access" "$api" ' 401$'
          check API_ENVELOPE "api error envelope present" "$api" '"code":"EDAM-2001"'
          check API_CORRELATION "api error carries a correlation id" "$api" '"correlationId":"[0-9a-f-]{36}"'
          lacks API_NO_LEAK "api error exposes no internal detail" "$api" 'stacktrace|java\.lang|org\.springframework|password'
          nav=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: text/html' http://localhost:18080/api/v1/system/info)
          check API_ANON_NAV "anonymous navigation to an API path answers 401, never 302" "$nav" '^401$'
          docs=$(curl -sS -w ' %{http_code}' http://localhost:18080/v3/api-docs)
          check OPENAPI_CODE "OpenAPI document served" "$docs" ' 200$'
          check OPENAPI_TITLE "OpenAPI document names the API" "$docs" '"title"'
          unknown=$(curl -sS -o /tmp/unknown.html -w '%{http_code}' http://localhost:18080/no-such-page-here)
          case "$unknown" in
            302) printf '::notice title=OK UNKNOWN_PATH::anonymous unknown path redirected to sign-in (%s)\n' "$unknown" ;;
            40*) printf '::notice title=OK UNKNOWN_PATH::anonymous unknown path answered %s\n' "$unknown" ;;
            *)   printf '::error title=FAIL UNKNOWN_PATH::unexpected status %s\n' "$unknown"; fail=1 ;;
          esac
          lacks UNKNOWN_PATH_LEAK "unknown path exposes no internal detail" "$(cat /tmp/unknown.html)" 'stacktrace|java\.lang|org\.springframework'
          curl -sSI -H 'Accept: application/json' http://localhost:18080/api/v1/system/info | tr -d '\r' > "$scratch/headers.txt" || true
          cid=$(grep -i '^X-Correlation-Id:' "$scratch/headers.txt" | head -1 || true)
          check CORRELATION "correlation id header present" "$cid" '^X-Correlation-Id: [0-9a-f-]{36}$'
          protected_code=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' \
            http://localhost:18080/api/v1/organization/profile)
          case "$protected_code" in
            401|403) printf '::notice title=OK PROTECTED::business endpoint refuses anonymous access (%s)\n' "$protected_code" ;;
            404)     printf '::notice title=OK PROTECTED::business endpoint not mapped in this build (%s)\n' "$protected_code" ;;
            *)       printf '::error title=FAIL PROTECTED::business endpoint answered %s\n' "$protected_code"; fail=1 ;;
          esac
          echo "--- startup log excerpt ---"
          grep -E "Flyway|Successfully applied|Started EdamApplication" war.log | head -10 || true
          exit $fail
      - name: Diagnostics
        if: always()
        run: |
          set +e
          [ -f war.log ] || exit 0
          sweep=""
          for path in /actuator/health /v3/api-docs /api/v1/system/info /api/v1/does-not-exist; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://localhost:18080$path")
            sweep="$sweep $path=$code"
          done
          security=$(grep -E "Securing |Failed to authorize|requires an authenticated|Access is denied" war.log | head -4 | tr '\n' '|' | head -c 700)
          errors=$(grep -E " ERROR |Exception" war.log | head -3 | tr '\n' '|' | head -c 600)
          printf '::error title=DIAGNOSTICS::sweep:%s || security:%s || errors:%s\n' \
            "$sweep" "${security:-none}" "${errors:-none}"
      - name: Application log on failure
        if: failure()
        run: tail -c 6000 war.log || true
      - name: Upload smoke logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: war-smoke-logs
          path: |
            war.log
            war-contents.txt
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 9

  prod-profile-smoke:
    name: prod-profile-smoke-test
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edam
          POSTGRES_USER: edam
          POSTGRES_PASSWORD: edam-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edam -d edam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download WAR (fall back to local package if artifact storage is exhausted)
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: edam-war
          path: target
      - name: Package WAR locally if download failed
        if: steps.dl.outcome != 'success'
        run: mvn -B -ntp -DskipTests package
      - name: Start with prod profile defaults
        run: |
          set -euo pipefail
          ls -la target/edam.war
          export EDAM_DB_URL=jdbc:postgresql://localhost:5432/edam
          export EDAM_DB_USERNAME=edam
          export EDAM_DB_PASSWORD=edam-ci-only
          nohup java -jar target/edam.war --spring.profiles.active=prod --server.port=18081 > prod.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Started EdamApplication" prod.log && { echo "STARTED after ${i}s"; break; }
            grep -qE "APPLICATION FAILED TO START" prod.log && { echo "STARTUP FAILED"; tail -c 4000 prod.log; exit 1; }
            sleep 2
          done
          grep -q "Started EdamApplication" prod.log || { echo "::error title=NO_START::prod profile did not start"; tail -c 4000 prod.log; exit 1; }
      - name: Smoke endpoints
        run: |
          set -uo pipefail
          h=$(curl -sS -o /tmp/h.json -w '%{http_code}' http://localhost:18081/actuator/health)
          test "$h" = "200" || { echo "::error title=PROD_HEALTH::status=$h"; cat /tmp/h.json; exit 1; }
      - name: Prod log on failure
        if: failure()
        run: tail -c 4000 prod.log || true
      - name: Upload prod logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-logs
          path: prod.log
          retention-days: 1
          if-no-files-found: ignore
          compression-level: 9
