name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: |
          set +e
          mvn -DskipTests compile > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "\[ERROR\]|\[WARNING\].*deprecat" build.log | head -25 | while IFS= read -r line; do
              printf '::error title=compile::%s\n' "$(printf '%s' "$line" | head -c 900)"
            done
          fi
          exit $rc

      - name: Test
        run: |
          set +e
          mvn test > test.log 2>&1
          rc=$?
          grep -E "\[ERROR\]" test.log | head -25 | while IFS= read -r line; do
            printf '::error title=test::%s\n' "$(printf '%s' "$line" | head -c 900)"
          done
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            printf '::notice title=TEST %s::%s\n' "$(basename "$f" .txt)" "$(grep -E 'Tests run' "$f" | head -2 | tr '\n' ' ')"
          done
          exit $rc

      - name: Package executable WAR
        run: mvn -DskipTests package
