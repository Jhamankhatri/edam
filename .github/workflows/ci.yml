name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: |
          set +e
          mvn verify > build.log 2>&1
          rc=$?
          emit() { printf '::%s title=%s::%s\n' "$1" "$2" "$(printf '%s' "$3" | head -c 1200)"; }
          # Compiler errors
          grep -E "^\[ERROR\] /home" build.log | head -15 | while IFS= read -r l; do emit error compile "$l"; done
          # Test failures with messages, in the order Maven prints them
          grep -E "^\[ERROR\]   [A-Za-z].*Test\." build.log | head -20 | while IFS= read -r l; do emit error failure "$l"; done
          # Root causes
          grep -E "^Caused by:|^\s+Caused by:" build.log | sort -u | head -12 | while IFS= read -r l; do emit error causedby "$l"; done
          # Application-bean / context startup failures
          grep -E "UnsatisfiedDependency|NoSuchBean|BeanCreationException|Failed to (load|instantiate)|Error creating bean" build.log | sort -u | head -8 | while IFS= read -r l; do emit error context "$l"; done
          # JSP / Jasper problems
          grep -iE "jasper|jsp" build.log | grep -iE "error|exception" | sort -u | head -8 | while IFS= read -r l; do emit error jsp "$l"; done
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            emit notice "TEST $(basename "$f" .txt)" "$(grep -E 'Tests run' "$f" | head -1)"
          done
          exit $rc
