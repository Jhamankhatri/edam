name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve dependencies (fast fail)
        run: mvn -q dependency:go-offline -DskipTests || true

      - name: Compile
        run: mvn -DskipTests compile

      - name: Test
        run: mvn test

      - name: Package executable WAR
        run: mvn -DskipTests package

      - name: Reports
        if: always()
        run: |
          report() { printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | head -c 900)"; }
          report BUILD_STATUS "compile/test/package steps above"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            report "TEST $(basename "$f" .txt)" "$(grep -E 'Tests run' "$f" | head -2 | tr '\n' ' ')"
          done
          ls -la target/*.war 2>/dev/null | awk '{print $5, $9}' || true
