name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B -ntp -Dstyle.color=never"

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: |
          set +e
          mvn verify > build.log 2>&1
          rc=$?
          python3 - <<'PY'
          import re, textwrap
          log = open('build.log', encoding='utf-8', errors='replace').read()
          def emit(kind, title, msg):
              msg = ' '.join(str(msg).split())
              print(f"::{kind} title={title}::{msg[:1400]}")
          # Prioritise the deepest causes.
          for m in list(re.finditer(r'Caused by: ([\w.$]+)(?::\s*(.{0,220}))?', log))[:8]:
              emit('error', 'caused-by', m.group(1) + ' :: ' + (m.group(2) or ''))
          for pat in ['UnsatisfiedDependencyException', 'BeanCreationException', 'NoSuchBeanDefinitionException',
                      'No qualifying bean', 'Failed to instantiate', 'Unable to start ServletWebServerApplicationContext',
                      'SQL State', 'Migration .* failed', 'Schema-validation', 'missing column', 'wrong column type',
                      'JasperException', 'Unable to compile class for JSP', 'NoClassDefFoundError', 'ClassNotFoundException',
                      'Field .* required a bean', 'Parameter \\d+ of (constructor|method)']:
              for m in list(re.finditer(pat, log))[:3]:
                  line_start = log.rfind('\n', 0, m.start()) + 1
                  line_end = log.find('\n', m.end())
                  emit('error', 'ctx', log[line_start:line_end][:600])
          PY
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            printf '::notice title=TEST %s::%s\n' "$(basename "$f" .txt)" "$(grep -E 'Tests run' "$f" | head -1)"
          done
          exit $rc
