name: debug-login

on:
  workflow_dispatch:
  push:
    branches: ["arena/a3508752-edam"]

jobs:
  dump:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp -q -DskipTests package
      - name: Start
        run: |
          set -euo pipefail
          java -jar target/edam.war --spring.profiles.active=local --server.port=18080 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:18080/login && break
            sleep 2
          done
          curl -s http://localhost:18080/login -o login.html || true
          wc -c login.html
      - name: Dump
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          body = open('login.html', encoding='utf-8', errors='replace').read()
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['GITHUB_RUN_ID']
          chunks = [body[i:i+900] for i in range(0, len(body), 900)] or ['<empty>']
          for index, chunk in enumerate(chunks[:60]):
              text = "CHUNK %d/%d :: %s" % (index + 1, len(chunks), chunk.replace("\n", ""))
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/check-runs/{run_id}/annotations",
                  method="GET")
          print("body-length", len(body))
          # annotations are created by the runner; print instead, GitHub shows step logs for this job
          print(body)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
