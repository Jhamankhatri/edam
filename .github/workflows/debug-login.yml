name: debug-login

on:
  workflow_dispatch:
  push:
    branches: ["arena/a3508752-edam"]

jobs:
  dump:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: edam
          POSTGRES_USER: edam
          POSTGRES_PASSWORD: edam-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edam -d edam"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -ntp -q -DskipTests package
      - name: Start and dump
        run: |
          set -uo pipefail
          export EDAM_DB_URL=jdbc:postgresql://localhost:5432/edam
          export EDAM_DB_USERNAME=edam
          export EDAM_DB_PASSWORD=edam-ci-only
          java -jar target/edam.war --spring.profiles.active=local --server.port=18080 > app.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Started EdamApplication" app.log && break
            sleep 2
          done
          code=$(curl -sS -o login.html -w '%{http_code}' http://localhost:18080/login) || true
          echo "::error title=DEBUG_STATUS::http=$code bytes=$(wc -c < login.html 2>/dev/null || echo 0)"
          python3 - <<'PY'
          import re
          body = open('login.html', encoding='utf-8', errors='replace').read()
          print("LEN", len(body))
          # home in on the theme block and the brand heading
          for match in re.finditer(r'(--edam-[a-z]+:[^;\n]*;?)|(<h1[^>]*>.*?</h1>)|(<style>.*?</style>)', body, re.S):
              print("::error title=DEBUG_PART::", match.group(0)[:300].replace("\n", " "))
          print("::error title=DEBUG_HEAD::", body[:300].replace("\n", " "))
          print("::error title=DEBUG_TAIL::", body[-300:].replace("\n", " "))
          PY
      - name: Application log
        if: always()
        run: grep -E " ERROR |Started EdamApplication|Tomcat started" app.log | tail -20 || true
