# =====================================================================================
# EDAM — base configuration (shared by every environment)
#
# Precedence: environment variables > profile file > this file.
# No secret belongs in this file; credentials arrive from the environment or a secret
# manager (see SECURITY_GUIDELINES.md).
# =====================================================================================
spring:
  application:
    name: edam
  profiles:
    # Fail fast and loudly when nobody declares an environment. Every deployment must set
    # SPRING_PROFILES_ACTIVE explicitly.
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # Store instants in UTC; render in the institution zone.
        order_inserts: true
        order_updates: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false    # An unexpected non-empty schema must stop the deploy.
    validate-on-migrate: true
    out-of-order: false
  security:
    filter:
      # REQUEST only (the Spring Boot default is every dispatcher type).
      #
      # ERROR: the container's error dispatch to /error must never be intercepted by
      #   authorization, otherwise a server fault is disguised as a 401. ServletFilterConfig
      #   restores the security context for that dispatch.
      # ASYNC: no asynchronous controllers exist.
      dispatcher-types: request
  mvc:
    problemdetails:
      enabled: false              # EDAM defines its own error envelope.
  web:
    error:
      include-message: never      # Never leak exception messages to clients.
      include-stacktrace: never
      include-exception: false
      include-binding-errors: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false             # Overridden per environment; must be true in production.

server:
  port: 8080
  servlet:
    context-path: /
    session:
      tracking-modes: cookie      # Do not expose the session id in URLs.
  error:
    path: /error
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true             # liveness/readiness groups for orchestration.
      show-details: never         # Never expose database or infrastructure detail.
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
    com.edam: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    # correlationId is bound to the MDC by CorrelationIdFilter.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

edam:
  application:
    version: '@project.version@'
  institution:
    code: demo-bank
    name: Demo Bank Limited
    short-name: DemoBank
    base-currency: PKR
    branding:
      primary-color: '#0f5132'
      secondary-color: '#14532d'
      accent-color: '#d1a055'
    locale:
      language-tag: en-PK
      time-zone: Asia/Karachi
      date-pattern: dd MMM yyyy
    features:
      # Feature flags are per-institution DATA (institution_feature_flag), not configuration.
      # The global switch that previously lived here asserted a business decision the BRD has
      # not made (FM-13/OD-27) and has been removed; see FeatureKey for the runtime catalogue.
      #
      # The department-head fallback is configuration on purpose: it applies only when an
      # institution has not created a General Delegation record (BRD OD-06, provisional P-6).
      department-head-limit-fallback: 20000.00

  # ---------------------------------------------------------------------------------------
  # Security policy (Module C). Length and lockout are a bank's information-security policy,
  # not a product opinion, so they are configuration with strict defaults.
  # ---------------------------------------------------------------------------------------
  security:
    password:
      min-length: 12
      max-length: 128
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: true
    lockout:
      # Consecutive failures before a lock, and how long it lasts. A very short lock does not stop
      # credential stuffing; a permanent one turns every typo into a support ticket.
      threshold: 5
      duration: PT15M
    password-reset:
      # Deliberately short: a reset link is a bearer credential until it is used.
      ttl: PT30M
  # Cross-origin policy for the separately deployed React client. Credentials are in play, so a
  # wildcard is impossible by construction; these are exact origins. Production must set
  # EDAM_CORS_ALLOWED_ORIGINS.
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
    preflight-max-age-seconds: 1800
  installation:
    # One-time first-administrator setup. EMPTY MEANS SETUP IS CLOSED, which is the safe default:
    # a deployment that forgets to set this cannot be taken over anonymously.
    bootstrap-token: ${EDAM_INSTALLATION_TOKEN:}
