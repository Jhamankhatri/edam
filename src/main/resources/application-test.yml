# =====================================================================================
# Automated-test environment.
#
# Datasource values are supplied by the test harness (Testcontainers PostgreSQL) so that
# Flyway validates the real PostgreSQL dialect instead of an in-memory approximation.
# =====================================================================================
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.edam: INFO
    org.springframework.web: INFO

edam:
  # Fixed HMAC key for deterministic cursor encoding/decoding tests.
  cursor-hmac-key: "test-cursor-hmac-key-not-for-production-0123456789"
  security:
    dev-users:
      enabled: true
    # The test suite must be able to complete the bootstrap path deliberately, and must be able to
    # unlock nothing by accident. A fixed test token is safe here: it exists only in the test profile,
    # the test database is ephemeral, and no deployment reads this file.
    password:
      min-length: 12
    lockout:
      threshold: 5
      duration: PT15M
    password-reset:
      ttl: PT30M
  installation:
    bootstrap-token: test-installation-token-not-a-secret
  cors:
    allowed-origins: http://localhost:5173
