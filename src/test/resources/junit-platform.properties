# Spring Boot's MockMvc auto-configuration registers a "print before assert" handler that
# dumps the full request/response for EVERY exchange. With ~30 web tests that buries real
# failures in thousands of lines, and the CI log is the only diagnostic channel available.
# Keep MockMvc's default of printing nothing unless an assertion fails: failures still
# include the printed exchange, successes stay quiet.
spring.test.mockmvc.print=none
